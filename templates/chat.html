<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Chat — DailyPlanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='design-system.css') }}">
<script src="https://unpkg.com/feather-icons"></script>
<script src="{{ url_for('static', filename='js/global.js') }}"></script>
<script src="{{ url_for('static', filename='js/toast.js') }}"></script>
<style>
  /* The chat page wants the entire viewport, since the bubble area
     scrolls independently of the page. Override the default page
     padding so the layout fills edge-to-edge under the nav. */
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-family); margin: 0; }

  .chat-shell {
    display: flex; flex-direction: column;
    /* 100dvh adapts to the iOS keyboard. Minus the top nav height. */
    height: calc(100dvh - 56px);
    max-width: 820px; margin: 0 auto;
  }

  .chat-header {
    padding: 12px 16px 8px;
    border-bottom: 1px solid var(--color-border);
    background: var(--color-surface);
  }
  .chat-header h1 {
    margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em;
  }
  .chat-header .sub {
    margin: 2px 0 0; font-size: 12px; color: var(--color-text-secondary);
  }

  /* Filter chip row. Sits between header and stream so the user
     can flip between conversation view and shares-only view without
     scrolling. */
  .chat-filter {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding: 8px 14px 0;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
  }
  .chat-filter-chip {
    border: 1px solid var(--color-border);
    background: transparent;
    color: var(--color-text-secondary);
    font: inherit; font-size: 12px; font-weight: 600;
    padding: 4px 11px; border-radius: 999px;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .chat-filter-chip:hover {
    background: var(--color-surface-secondary, #f3f4f6);
    color: var(--color-text);
  }
  .chat-filter-chip.is-active {
    background: var(--color-primary);
    color: white;
    border-color: var(--color-primary);
  }

  /* Filter-driven visibility — CSS instead of re-rendering, so the
     scroll position is preserved as the user toggles modes.
     `shares` keeps everything except plain text. */
  .chat-stream[data-filter="shares"]      .msg[data-kind="text"],
  .chat-stream[data-filter="kb-share"]    .msg:not([data-kind="kb-share"]),
  .chat-stream[data-filter="inbox-share"] .msg:not([data-kind="inbox-share"]) {
    display: none;
  }
  /* Day separators are noise under any filter that hides messages;
     hide them too so we don't leave orphaned "Today" pills. */
  .chat-stream:not([data-filter="all"]) .day-sep { display: none; }

  /* Scrollable bubble area. flex:1 swallows the leftover height between
     header and composer. */
  .chat-stream {
    flex: 1; min-height: 0;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex; flex-direction: column; gap: 4px;
    background: var(--color-bg);
  }
  .chat-stream::-webkit-scrollbar { width: 8px; }
  .chat-stream::-webkit-scrollbar-thumb {
    background: var(--color-border); border-radius: 4px;
  }

  /* Bubble — left for others, right for the viewer. Author name shown
     only when sender changes from the previous bubble (grouping). */
  .msg {
    display: flex; flex-direction: column;
    max-width: 76%;
    padding: 7px 11px 6px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14px;
    position: relative;
    word-wrap: break-word; overflow-wrap: anywhere;
  }
  .msg.theirs {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    color: var(--color-text);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .msg.mine {
    background: #2563eb;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .msg.continuation { margin-top: 1px; }
  .msg.fresh        { margin-top: 10px; }

  /* Visual cue on share bubbles regardless of filter — left accent
     stripe so they're scannable in the All view too. */
  .msg[data-kind="kb-share"],
  .msg[data-kind="inbox-share"] {
    border-left: 3px solid #f59e0b;
  }
  .msg.mine[data-kind="kb-share"],
  .msg.mine[data-kind="inbox-share"] {
    border-left-color: #fde047;
  }

  .msg-author {
    font-size: 11.5px; font-weight: 600;
    color: #2563eb;
    margin-bottom: 2px;
  }
  .msg.mine .msg-author { display: none; }

  .msg-body {
    white-space: pre-wrap;
  }
  /* Anchors pick up the bubble's text colour so links don't look
     wrong on blue (mine) or default link-blue on white (theirs). */
  .msg-body a {
    color: inherit; text-decoration: underline;
    text-underline-offset: 2px;
    word-break: break-all;
  }
  .msg.theirs .msg-body a { color: #2563eb; }
  .msg-body a:hover { text-decoration: none; }

  .msg-meta {
    font-size: 10.5px; opacity: .65;
    margin-top: 2px;
    display: flex; gap: 6px; align-items: center;
  }
  .msg.mine .msg-meta { justify-content: flex-end; color: rgba(255,255,255,.85); }
  .msg-del {
    background: none; border: none;
    color: inherit; opacity: 0;
    cursor: pointer; padding: 0; font-size: 10.5px;
    transition: opacity .12s;
  }
  .msg.mine:hover .msg-del { opacity: 0.85; }
  .msg-del:hover { opacity: 1; text-decoration: underline; }

  /* Day separator chip between messages on different calendar days. */
  .day-sep {
    align-self: center;
    font-size: 11px; font-weight: 600;
    color: var(--color-text-muted, #94a3b8);
    background: var(--color-surface);
    padding: 3px 10px; border-radius: 999px;
    margin: 12px 0 4px;
    border: 1px solid var(--color-border);
  }

  /* Composer — sticky bottom strip with textarea + send button. */
  .chat-composer {
    border-top: 1px solid var(--color-border);
    background: var(--color-surface);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0));
    display: flex; gap: 8px; align-items: flex-end;
  }
  .chat-composer textarea {
    flex: 1; min-height: 38px; max-height: 140px;
    padding: 9px 12px;
    border: 1px solid var(--color-border);
    border-radius: 10px;
    font: inherit;
    background: var(--color-bg);
    color: var(--color-text);
    resize: none;
    outline: none;
    line-height: 1.4;
  }
  .chat-composer textarea:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px var(--color-primary-ring, rgba(37,99,235,.15));
  }
  .chat-send {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px;
    background: var(--color-primary); color: white;
    border: none; border-radius: 10px;
    cursor: pointer;
    transition: background .12s, transform .08s;
  }
  .chat-send:hover { background: var(--color-primary-hover, #1d4ed8); }
  .chat-send:active { transform: scale(.95); }
  .chat-send:disabled { background: var(--color-text-muted, #94a3b8); cursor: not-allowed; }
  .chat-send svg { width: 18px; height: 18px; }

  .chat-empty {
    margin: auto; text-align: center;
    color: var(--color-text-secondary); font-size: 14px;
    padding: 24px;
  }
  .chat-empty svg {
    width: 36px; height: 36px; opacity: .55;
    margin-bottom: 8px;
  }

  @media (max-width: 640px) {
    .chat-shell { height: calc(100dvh - 48px); }
  }
</style>
{% include "_pwa_head.html" %}
</head>
<body>

<div class="nav-icons">{% include "_top_nav.html" %}</div>

<div class="chat-shell">
  <header class="chat-header">
    <h1>💬 Family chat</h1>
    <p class="sub">Everyone signed into this app sees this room. Posting as <b>{{ viewer_name }}</b>.</p>
  </header>

  <div class="chat-filter" role="tablist">
    <button type="button" class="chat-filter-chip is-active" data-filter="all">All</button>
    <button type="button" class="chat-filter-chip" data-filter="shares">Shares only</button>
    <button type="button" class="chat-filter-chip" data-filter="kb-share">📚 KB</button>
    <button type="button" class="chat-filter-chip" data-filter="inbox-share">📥 Inbox</button>
  </div>

  <div class="chat-stream" id="chat-stream" data-filter="all">
    <div class="chat-empty" id="chat-empty">
      <i data-feather="message-circle"></i>
      <div>Loading messages…</div>
    </div>
  </div>

  <form class="chat-composer" id="chat-form" autocomplete="off">
    <textarea id="chat-input"
              placeholder="Type a message… (Enter to send, Shift+Enter for newline)"
              rows="1" maxlength="2000"></textarea>
    <button type="submit" class="chat-send" id="chat-send" title="Send">
      <i data-feather="send"></i>
    </button>
  </form>
</div>

<script>
(() => {
  const CSRF = document.querySelector('meta[name="csrf-token"]')?.content || "";
  const POLL_MS = 3000;

  const stream  = document.getElementById("chat-stream");
  const form    = document.getElementById("chat-form");
  const input   = document.getElementById("chat-input");
  const sendBtn = document.getElementById("chat-send");

  const state = {
    since: null,           // ISO timestamp cursor for next poll
    lastAuthorId: null,    // for bubble grouping
    lastDay: null,         // for day-separator insertion
    rendered: new Set(),   // de-dupe (optimistic + polled echo)
    pollTimer: null,
    stickToBottom: true,   // false once user scrolls up
  };

  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

  // Render body as HTML-safe text with http(s):// URLs turned into
  // anchors. The regex stops at whitespace, quotes, and angle brackets,
  // and we strip trailing punctuation (.,;:!?) so "see https://x.com."
  // doesn't capture the period into the link target.
  const URL_RE = /https?:\/\/[^\s"'<>]+/g;
  const TRAILING_PUNCT = /[.,;:!?)\]]+$/;
  function renderBody(raw) {
    const safe = esc(raw);
    return safe.replace(URL_RE, (m) => {
      let trimmed = m;
      let tail = "";
      const t = TRAILING_PUNCT.exec(trimmed);
      if (t) { tail = t[0]; trimmed = trimmed.slice(0, -tail.length); }
      // The URL has already been HTML-escaped above, so no further
      // escaping is needed for either the href or the visible text.
      const a = `<a href="${trimmed}" target="_blank" rel="noopener noreferrer nofollow">${trimmed}</a>`;
      return a + tail;
    });
  }

  const toast = (msg, kind="info") =>
    window.showToast ? window.showToast(msg, kind, 2500) : console.log("[chat]", msg);

  // Format a timestamp to "h:mm AM/PM" within today, "Mon h:mm AM" within
  // the week, "MMM D, h:mm AM" otherwise. Cheap heuristic for chat UX.
  const fmtTime = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  };

  // Day key (yyyy-mm-dd in local time) for separator placement.
  const dayKey = (iso) => {
    if (!iso) return "";
    const d = new Date(iso);
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  };
  const dayLabel = (iso) => {
    const d = new Date(iso);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const yest = new Date(now); yest.setDate(now.getDate() - 1);
    const sameYest = d.toDateString() === yest.toDateString();
    if (sameDay)  return "Today";
    if (sameYest) return "Yesterday";
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  };

  // Is the user already scrolled to within ~80px of the bottom? Used to
  // decide whether to auto-stick on new messages vs. respect a manual
  // scroll-up (which usually means they're reading history).
  const isAtBottom = () =>
    stream.scrollHeight - stream.scrollTop - stream.clientHeight < 80;

  const scrollToBottom = (smooth=false) => {
    stream.scrollTo({ top: stream.scrollHeight, behavior: smooth ? "smooth" : "auto" });
  };

  stream.addEventListener("scroll", () => {
    state.stickToBottom = isAtBottom();
  });

  function appendMessage(m) {
    if (state.rendered.has(m.id)) return;
    state.rendered.add(m.id);

    // Day separator if the date rolled over since the last message.
    const dk = dayKey(m.created_at);
    if (dk !== state.lastDay) {
      const sep = document.createElement("div");
      sep.className = "day-sep";
      sep.textContent = dayLabel(m.created_at);
      stream.appendChild(sep);
      state.lastDay = dk;
      state.lastAuthorId = null;   // group resets at a day break
    }

    const continuation = state.lastAuthorId === m.user_id;
    const bubble = document.createElement("div");
    bubble.className = "msg " + (m.is_mine ? "mine" : "theirs") +
                       (continuation ? " continuation" : " fresh");
    bubble.dataset.id = m.id;
    // Drives the filter CSS (data-filter on .chat-stream + this attr)
    // and the share-bubble left-stripe styling.
    bubble.dataset.kind = m.kind || "text";
    bubble.innerHTML = `
      ${continuation ? "" : `<div class="msg-author">${esc(m.author_name)}</div>`}
      <div class="msg-body">${renderBody(m.body)}</div>
      <div class="msg-meta">
        <span>${esc(fmtTime(m.created_at))}</span>
        ${m.is_mine ? `<button type="button" class="msg-del" data-act="del">delete</button>` : ""}
      </div>`;
    stream.appendChild(bubble);
    state.lastAuthorId = m.user_id;

    if (m.is_mine) {
      bubble.querySelector('[data-act="del"]')?.addEventListener("click", () => deleteMessage(m.id));
    }
  }

  function clearLoadingHint() {
    document.getElementById("chat-empty")?.remove();
  }

  function renderEmptyState() {
    if (stream.children.length === 0) {
      stream.innerHTML = `
        <div class="chat-empty">
          <i data-feather="message-circle"></i>
          <div>No messages yet. Say hi 👋</div>
        </div>`;
      if (window.feather) feather.replace();
    }
  }

  // ── Network ────────────────────────────────────────────────────
  async function loadInitial() {
    try {
      const r = await fetch("/api/chat/messages", { credentials: "same-origin" });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.status);
      clearLoadingHint();
      for (const m of data.messages) appendMessage(m);
      state.since = data.now;
      scrollToBottom(false);
      renderEmptyState();
      // Cold open = we've now seen whatever was waiting. Clear the
      // badge from any page the user opens next.
      markRead();
    } catch (e) {
      console.error(e);
      toast("Couldn't load chat", "error");
    } finally {
      startPolling();
    }
  }

  // POST the read cursor; harmless to spam. Triggers a badge refresh
  // on the next paint so the nav-bar icon catches up without waiting
  // for its own 60s poll cycle.
  async function markRead() {
    try {
      await fetch("/api/chat/mark-read", {
        method: "POST",
        headers: { "X-CSRFToken": CSRF },
        credentials: "same-origin",
      });
      if (typeof window.dpChatBadgeRefresh === "function") {
        window.dpChatBadgeRefresh();
      }
    } catch (_) { /* non-fatal */ }
  }

  async function poll() {
    if (!state.since) return;
    try {
      const r = await fetch("/api/chat/messages?since=" + encodeURIComponent(state.since), {
        credentials: "same-origin",
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.status);
      // Even if the message list is empty, advance the cursor to the
      // server's now-time so we never get stuck on a stale `since`.
      state.since = data.now;
      if (data.messages.length === 0) return;
      const wasAtBottom = state.stickToBottom;
      document.getElementById("chat-empty")?.remove();
      for (const m of data.messages) appendMessage(m);
      if (wasAtBottom) scrollToBottom(true);
      // New messages while the chat page is in front = the user has
      // already seen them. Bump the read cursor so the badge clears
      // on the other pages they have open.
      if (!document.hidden) markRead();
    } catch (e) {
      // Transient failures are common (network blip, app waking up) —
      // log but keep polling so the chat recovers without a reload.
      console.warn("[chat] poll failed:", e);
    }
  }

  function startPolling() {
    if (state.pollTimer) return;
    // Page Visibility: pause polling when the tab is hidden so we don't
    // burn DB reads while the user isn't looking. Resume on focus.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stopPolling();
      else { poll(); startPolling(); markRead(); }
    });
    state.pollTimer = setInterval(poll, POLL_MS);
  }
  function stopPolling() {
    if (state.pollTimer) {
      clearInterval(state.pollTimer);
      state.pollTimer = null;
    }
  }

  async function sendMessage(body) {
    sendBtn.disabled = true;
    try {
      const r = await fetch("/api/chat/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": CSRF },
        body: JSON.stringify({ body }),
        credentials: "same-origin",
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || r.status);
      // Render the canonical server row immediately so the sender sees
      // their message without waiting for the next poll cycle.
      document.getElementById("chat-empty")?.remove();
      appendMessage(data.message);
      scrollToBottom(true);
    } catch (e) {
      console.error(e);
      toast("Couldn't send: " + (e.message || ""), "error");
      // Restore the unsent text so they can retry without retyping,
      // and refocus so the keyboard is ready for the fix.
      input.value = body;
      autoResize();
      input.focus();
    } finally {
      sendBtn.disabled = false;
    }
  }

  async function deleteMessage(id) {
    if (!confirm("Delete this message?")) return;
    try {
      const r = await fetch("/api/chat/messages/" + encodeURIComponent(id), {
        method: "DELETE",
        headers: { "X-CSRFToken": CSRF },
        credentials: "same-origin",
      });
      if (!r.ok) {
        const data = await r.json().catch(() => ({}));
        throw new Error(data.error || r.status);
      }
      // Optimistic local removal — polling won't re-deliver it because
      // the server filter excludes rows with deleted_at set.
      document.querySelector(`.msg[data-id="${id}"]`)?.remove();
    } catch (e) {
      toast("Couldn't delete", "error");
    }
  }

  // ── Composer ───────────────────────────────────────────────────
  function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(140, input.scrollHeight) + "px";
  }
  input.addEventListener("input", autoResize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const body = input.value.trim();
    if (!body) return;
    input.value = "";
    autoResize();
    sendMessage(body);
  });

  // Filter chips → drive .chat-stream[data-filter] which the CSS uses
  // to show/hide bubbles by kind. Re-rendering would lose scroll
  // position; CSS toggle keeps everything in place.
  document.querySelectorAll(".chat-filter-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const f = chip.dataset.filter;
      stream.dataset.filter = f;
      document.querySelectorAll(".chat-filter-chip").forEach(c =>
        c.classList.toggle("is-active", c.dataset.filter === f));
      // After a filter change, stick to the bottom if the user was
      // already there — otherwise stay put.
      if (state.stickToBottom) scrollToBottom(false);
    });
  });

  // Boot
  if (window.feather) feather.replace();
  loadInitial();
})();
</script>

</body>
</html>
