<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>AI SDE Prep — DailyPlanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='design-system.css') }}">
<script src="https://unpkg.com/feather-icons"></script>
<script src="{{ url_for('static', filename='js/global.js') }}"></script>
<script src="{{ url_for('static', filename='js/toast.js') }}"></script>
<style>
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-family); margin: 0;
         overflow-x: hidden; }
  /* Long unbroken strings in a title or tag must not widen the page. */
  .q-text, .fld, .ex-slot { overflow-wrap: anywhere; min-width: 0; }
  .wrap { max-width: 780px; margin: 0 auto; padding: 16px 16px 72px; }
  h1 { font-size: 22px; font-weight: 900; letter-spacing: -.02em; margin: 6px 0 2px; }
  .sub { color: var(--color-text-secondary); font-size: 13px; margin: 0 0 14px; }
  .sub a { color: var(--color-primary); font-weight: 700; text-decoration: none; }
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 14px; padding: 14px; }
  .btn { font: inherit; font-weight: 700; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  .btn.sm { padding: 5px 9px; font-size: 12.5px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .controls select, .controls input[type=text] { font: inherit; font-size: 14px; padding: 9px 11px; border: 1px solid var(--color-border); border-radius: 10px; background: var(--color-bg); color: var(--color-text); }
  .controls input.search { flex: 1; min-width: 160px; }
  .only { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--color-text-secondary); white-space: nowrap; }
  .prog { font-size: 12.5px; font-weight: 700; color: var(--color-text-secondary); }

  .q-card { border: 1px solid var(--color-border); border-radius: 12px; margin-bottom: 8px; background: var(--color-surface); overflow: hidden; }
  .q-card.done { border-color: #a7f3d0; }
  /* Wraps, because this row now carries up to six chips (priority, time,
     frequency, sub-area, difficulty, category) and they are all flex:none.
     Without wrapping they cannot shrink and the row is simply clipped off
     the side of a phone. */
  .q-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 11px 13px; cursor: pointer; }
  .q-head .q-prac { width: 18px; height: 18px; flex: none; cursor: pointer; }
  .q-head .q-text { flex: 1; font-size: 14.5px; font-weight: 700; min-width: 0; }
  /* The chips live in their own element so a phone can drop them onto a
     second line as a group. `display: contents` means the wrapper is invisible
     to layout on a wide screen, so the row looks exactly as it always did. */
  .q-head .q-chips { display: contents; }
  .q-head .q-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--color-text-secondary); background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 999px; padding: 3px 8px; white-space: nowrap; flex: none; }
  .q-card.done .q-text { color: var(--color-text-secondary); }
  .q-body { padding: 0 13px 13px 41px; display: none; }
  .q-card.open .q-body { display: block; }
  .fld { margin: 8px 0; font-size: 13.5px; line-height: 1.5; }
  .fld .lbl { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-secondary); display: block; margin-bottom: 2px; }
  .fld.answer .lbl { color: #4338ca; } .fld.pitfall .lbl { color: #b45309; } .fld.follow .lbl { color: #047857; } .fld.cx .lbl { color: #0369a1; }
  .fld.freq .lbl { color: #9333ea; } .fld.mnem .lbl { color: #c2410c; }
  .code.diagram { background: #f8fafc; color: #0f172a; border-color: #cbd5e1; }
  html.dark .code.diagram { background: #0b1220; color: #cbd5e1; }
  .fld.mnem { background: #fff7ed; border-left: 3px solid #fb923c; border-radius: 6px; padding: 6px 10px; }
  html.dark .fld.mnem { background: #2a1a0f; }
  /* The ANSWER is the field she reads under time pressure, so it is written as
     a one-line headline followed by short labelled points — and that shape only
     survives if the line breaks do. Without pre-wrap the whole thing collapses
     into one unbroken paragraph, which is what it used to do. The first line is
     given a little more weight so the headline reads as a headline. */
  .fld.answer { white-space: pre-wrap; background: #f5f7ff; border-left: 3px solid #6366f1;
                border-radius: 6px; padding: 8px 11px; font-size: 13.5px; line-height: 1.6;
                overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .fld.answer .head { display: block; font-weight: 700; font-size: 14.5px; line-height: 1.45;
                      margin-bottom: 6px; color: var(--color-text); }
  html.dark .fld.answer { background: #131a33; border-left-color: #818cf8; }
  /* Long-form "explain it like I'm new to this" walkthrough: keeps the
     step/section line breaks the text was written with. */
  .fld.deep { white-space: pre-wrap; background: #f5f7ff; border-left: 3px solid #6366f1;
              border-radius: 6px; padding: 8px 11px; font-size: 13px; line-height: 1.62;
              overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .fld.deep .lbl { color: #4338ca; }
  html.dark .fld.deep { background: #131a33; border-left-color: #818cf8; }
  /* Several worked examples per topic, each numbered and independently read.
     Each one is a <details>: a ten-section rewrite runs to several thousand
     characters, so ten of them expanded at once is a wall you scroll past
     rather than read. Collapsed, their opening lines ("1. THE GOAL IN PLAIN
     ENGLISH", "5. THE SLOW VERSION FIRST") read as a table of contents. */
  .ex-slot { margin: 0; }
  .ex { margin-bottom: 5px; background: #f0fdf4; border-left: 3px solid #34d399;
        border-radius: 6px; overflow: hidden; }
  .ex > summary { display: flex; gap: 9px; align-items: center; padding: 8px 10px; cursor: pointer;
                  list-style: none; font-size: 12.5px; font-weight: 700; line-height: 1.4;
                  min-height: 36px; }
  .ex > summary::-webkit-details-marker { display: none; }
  .ex > summary .caret { margin-left: auto; flex: none; font-size: 11px; color: var(--color-text-secondary);
                         transition: transform .12s ease; }
  .ex[open] > summary .caret { transform: rotate(90deg); }
  .ex .n { flex: none; width: 19px; height: 19px; border-radius: 50%; background: #059669; color: #fff;
           font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .ex .exttl { min-width: 0; overflow-wrap: anywhere; }
  /* The worked examples contain ASCII tables and rules ("---+----+---",
     "═══════") that pre-wrap cannot break, so without a scroller they widen
     the whole card and the page gets cut off on a phone. */
  .ex .body { white-space: pre-wrap; font-size: 13px; line-height: 1.6; min-width: 0;
              overflow-x: auto; -webkit-overflow-scrolling: touch;
              padding: 0 10px 10px 38px; display: block; }

  /* ── Collapsible sections ───────────────────────────────────────────
     A written-up topic carries answer + walkthrough + plain-English recipe +
     code + diagram + ten worked examples + the recall quiz — around 16,000
     characters. Rendered flat that is a wall on a phone, so every section is
     a <details> and the labels become a table of contents. The answer opens
     by default because it is what you came for; everything else is one tap. */
  .sec { border: 1px solid var(--color-border); border-radius: 9px; margin: 6px 0;
         background: var(--color-bg); overflow: hidden; }
  .sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
                   padding: 9px 11px; min-height: 38px; font-size: 10.5px; font-weight: 800;
                   text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-secondary); }
  .sec > summary::-webkit-details-marker { display: none; }
  .sec > summary .caret { flex: none; font-size: 11px; transition: transform .12s ease; }
  .sec[open] > summary .caret { transform: rotate(90deg); }
  .sec > summary .hint2 { margin-left: auto; flex: none; font-size: 10px; font-weight: 700;
                          text-transform: none; letter-spacing: 0; color: var(--color-text-muted); }
  .sec > .secbody { padding: 0 11px 11px; }
  .sec > .secbody > .fld { margin-top: 0; }
  .sec > .secbody > .code { margin-top: 0; }
  .sec-answer > summary { color: #4338ca; } .sec-deep > summary { color: #4338ca; }
  .sec-recipe > summary { color: #b45309; } .sec-pitfall > summary { color: #b45309; }
  .sec-follow > summary { color: #047857; } .sec-exs > summary { color: #047857; }
  .sec-cx > summary { color: #0369a1; } .sec-freq > summary { color: #9333ea; }
  .sec-mnem > summary { color: #c2410c; }
  html.dark .sec-answer > summary, html.dark .sec-deep > summary { color: #a5b4fc; }
  html.dark .sec-recipe > summary, html.dark .sec-pitfall > summary { color: #fcd34d; }
  html.dark .sec-follow > summary, html.dark .sec-exs > summary { color: #6ee7b7; }
  /* One tap to open everything, for reading a topic end to end. */
  .secbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 8px; }
  html.dark .ex { background: #0e2119; border-left-color: #10b981; }
  /* Planning chips: study priority, stack rank and how long the topic takes. */
  .q-pri { font-size: 10px; font-weight: 900; letter-spacing: .03em; border-radius: 999px; padding: 2px 7px; white-space: nowrap; flex: none; }
  .pri-P0 { color: #fff; background: #dc2626; } .pri-P1 { color: #fff; background: #ea580c; }
  .pri-P2 { color: #fff; background: #0891b2; } .pri-P3 { color: var(--color-text-secondary); background: var(--color-bg); border: 1px solid var(--color-border); }
  .q-time { font-size: 10.5px; font-weight: 800; color: #4338ca; background: #eef2ff; border-radius: 999px; padding: 2px 8px; white-space: nowrap; flex: none; }
  html.dark .q-time { color: #c7d2fe; background: #1e1b4b; }
  .q-rank { font-size: 10.5px; font-weight: 700; color: var(--color-text-secondary); white-space: nowrap; flex: none; }
  /* Interview-tag row and chips. The frequency chip is the loud one: it is
     the single most useful thing on the card when time is short. */
  .controls.tagrow { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--color-border); }
  .tagrow-lbl { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
                color: var(--color-text-secondary); align-self: center; }
  .q-freq { font-size: 10px; font-weight: 900; letter-spacing: .02em; border-radius: 999px;
            padding: 2px 8px; white-space: nowrap; flex: none; }
  .freq-must { color: #fff; background: #b91c1c; }
  .freq-common { color: #fff; background: #7c3aed; }
  .freq-rare { color: var(--color-text-secondary); background: var(--color-bg); border: 1px solid var(--color-border); }
  .q-sub { font-size: 10px; font-weight: 800; color: #0f766e; background: #ccfbf1; border-radius: 999px;
           padding: 2px 8px; white-space: nowrap; flex: none; }
  html.dark .q-sub { color: #5eead4; background: #042f2e; }
  .fld.tags { background: #fdf4ff; border-left: 3px solid #a855f7; }
  html.dark .fld.tags { background: #2a1033; }
  .fld.tags .flagnote { display: block; margin-top: 4px; font-style: italic; color: var(--color-text-secondary); }
  /* The effort readout under the title: total time, and how much is left. */
  .effort { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; font-weight: 700;
            color: var(--color-text-secondary); margin: 0 0 10px; }
  .effort b { color: var(--color-text); font-weight: 900; }
  .effort .bar { flex: 1 0 100%; height: 6px; border-radius: 999px; background: var(--color-border); overflow: hidden; }
  .effort .bar > i { display: block; height: 100%; background: #10b981; }
  /* The plain-English recipe you read BEFORE the code: numbered steps, kept
     on their own lines so you can follow one line at a time while typing. */
  .fld.recipe { white-space: pre-wrap; background: #fffbeb; border-left: 3px solid #f59e0b;
                border-radius: 6px; padding: 8px 11px; font-size: 13px; line-height: 1.6;
                overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .fld.recipe .lbl { color: #b45309; }
  html.dark .fld.recipe { background: #241a06; border-left-color: #fbbf24; }
  .fld.plan { background: #f5f3ff; border-left: 3px solid #8b5cf6; border-radius: 6px; padding: 6px 10px; }
  .fld.plan .lbl { color: #6d28d9; }
  html.dark .fld.plan { background: #1e1b33; }
  .q-diff { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .diff-easy { color: #047857; background: #d1fae5; } .diff-medium { color: #b45309; background: #fef3c7; } .diff-hard { color: #b91c1c; background: #fee2e2; }
  html.dark .diff-easy { color: #6ee7b7; background: #064e3b; } html.dark .diff-medium { color: #fcd34d; background: #78350f; } html.dark .diff-hard { color: #fca5a5; background: #7f1d1d; }
  .code { background: var(--color-bg); border: 1px solid var(--color-border); border-radius: 8px; padding: 10px 12px; margin: 8px 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.45; white-space: pre; overflow-x: auto; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 9px 0 2px; }
  .tag { font-size: 11px; font-weight: 600; color: #4338ca; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 999px; padding: 2px 9px; cursor: pointer; }
  html.dark .tag { background: #1e1b4b; border-color: #3730a3; color: #c7d2fe; }
  .q-actions { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  /* ── Schedule this topic onto a day ──────────────────────────────
     Hidden until the button is pressed, and it takes a whole row of its
     own when it opens (flex-basis:100%) so the date and time fields never
     have to share a line with the PDF and Schedule buttons on a phone. */
  .sched { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
           margin-top: 6px; padding: 10px; border: 1px dashed var(--color-border);
           border-radius: 10px; background: var(--color-bg); }
  .sched[hidden] { display: none; }
  .sched label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
                 color: var(--color-text-secondary); }
  .sched input { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--color-border);
                 border-radius: 8px; background: var(--color-surface); color: var(--color-text);
                 min-width: 0; }
  .sched .btn.primary { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
  .sched-msg { flex-basis: 100%; font-size: 11.5px; color: var(--color-text-secondary); }
  .sched-msg.ok  { color: #047857; font-weight: 700; }
  .sched-msg.err { color: #b91c1c; font-weight: 700; }
  html.dark .sched-msg.ok { color: #6ee7b7; } html.dark .sched-msg.err { color: #fca5a5; }
  /* Its phone rules live in the single @media block below, not in one of
     their own — the page has exactly one mobile block by convention. */

  .empty { color: var(--color-text-secondary); font-size: 14px; padding: 26px 0; text-align: center; }
  h2 { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-secondary); margin: 22px 0 10px; }

  /* ── Mobile ── */
  @media (max-width: 640px) {
    .wrap { padding: 12px 11px 64px; }
    h1 { font-size: 19px; }
    .sub { font-size: 12.5px; }
    .controls { flex-direction: column; align-items: stretch; }
    .controls select, .controls input.search, .controls button { width: 100%; box-sizing: border-box; }
    .only { padding: 2px 0; }
    .q-head { padding: 11px 12px; gap: 7px; }
    /* Checkbox and title on the first line, the six chips wrapped underneath
       as their own row. This replaces an earlier version that gave the title
       `order: -1` and pulled it back up with `margin-top: -24px` — that lifted
       the first line of the title 24px into 11px of padding, so on a phone the
       top of every question was sliced off by the card's overflow: hidden.
       Never position a text line with a negative margin larger than the
       padding it is moving into. */
    .q-head .q-text { font-size: 14px; flex: 1 1 auto; min-width: 0; }
    .q-head .q-chips { display: flex; flex-wrap: wrap; align-items: center;
                       gap: 6px; flex: 1 0 100%; }
    .q-head .q-prac { align-self: flex-start; margin-top: 2px; }
    .q-body { padding: 0 12px 12px 12px; }
    .q-head .q-badge { font-size: 9px; padding: 2px 6px; }
    .q-body { padding: 0 12px 12px 12px; }   /* drop the big left indent on phones */
    .fld { font-size: 13.5px; }
    .code { font-size: 11.5px; padding: 9px 10px; -webkit-overflow-scrolling: touch; }
    .tag { font-size: 11px; }
    /* No room to indent an example's body under its number on a phone. */
    .ex .body { padding: 0 10px 10px 10px; }
    .sec > .secbody { padding: 0 9px 10px; }
    .sec > summary, .ex > summary { min-height: 42px; }   /* thumb-sized targets */
    /* Each scheduler field on its own line — a date picker squeezed next
       to a time picker on a 360px screen leaves neither one tappable. */
    .sched label { flex-basis: 100%; }
    .sched label input { flex: 1; }
    .sched .btn { width: 100%; }
  }
  /* Same dark treatment when the OS is set to dark but no explicit
     .dark class is present. Without this, these panels keep their light
     background while --color-text flips to near-white, so the text
     disappears on mobile. */
  html.dark .fld.deep .lbl { color: #a5b4fc; }
  html.dark .fld.recipe .lbl { color: #fcd34d; }
  html.dark .fld.plan .lbl { color: #c4b5fd; }
  html.dark .ex .n { background: #10b981; }
  html.dark .fld.answer .lbl { color: #a5b4fc; }
  html.dark .fld.freq .lbl { color: #d8b4fe; }
  html.dark .fld.mnem .lbl { color: #fdba74; }
  html.dark .fld.cx .lbl { color: #7dd3fc; }
  html.dark .fld.pitfall .lbl { color: #fcd34d; }
  html.dark .fld.follow .lbl { color: #6ee7b7; }
  @media (prefers-color-scheme: dark) {
    :root:not(.light) .sec-answer > summary, :root:not(.light) .sec-deep > summary { color: #a5b4fc; }
    :root:not(.light) .sec-recipe > summary, :root:not(.light) .sec-pitfall > summary { color: #fcd34d; }
    :root:not(.light) .sec-follow > summary, :root:not(.light) .sec-exs > summary { color: #6ee7b7; }
    :root:not(.light) .code.diagram { background: #0b1220; color: #cbd5e1; }
    :root:not(.light) .fld.mnem { background: #2a1a0f; }
    :root:not(.light) .fld.deep { background: #131a33; border-left-color: #818cf8; }
    :root:not(.light) .fld.answer { background: #131a33; border-left-color: #818cf8; }
    :root:not(.light) .ex { background: #0e2119; border-left-color: #10b981; }
    :root:not(.light) .q-time { color: #c7d2fe; background: #1e1b4b; }
    :root:not(.light) .fld.recipe { background: #241a06; border-left-color: #fbbf24; }
    :root:not(.light) .fld.plan { background: #1e1b33; }
    :root:not(.light) .diff-easy { color: #6ee7b7; background: #064e3b; }
    :root:not(.light) .diff-medium { color: #fcd34d; background: #78350f; }
    :root:not(.light) .diff-hard { color: #fca5a5; background: #7f1d1d; }
    :root:not(.light) .tag { background: #1e1b4b; border-color: #3730a3; color: #c7d2fe; }
    :root:not(.light) .fld.deep .lbl { color: #a5b4fc; }
    :root:not(.light) .fld.recipe .lbl { color: #fcd34d; }
    :root:not(.light) .fld.plan .lbl { color: #c4b5fd; }
    :root:not(.light) .ex .n { background: #10b981; }
    :root:not(.light) .fld.answer .lbl { color: #a5b4fc; }
    :root:not(.light) .fld.freq .lbl { color: #d8b4fe; }
    :root:not(.light) .fld.mnem .lbl { color: #fdba74; }
    :root:not(.light) .fld.cx .lbl { color: #7dd3fc; }
    :root:not(.light) .fld.pitfall .lbl { color: #fcd34d; }
    :root:not(.light) .fld.follow .lbl { color: #6ee7b7; }
  }

  /* ── Recall quiz ────────────────────────────────────────────────────
     Sits at the BOTTOM of the card, below everything it tests. Answers are
     hidden behind a button: an answer visible on screen turns recall back
     into recognition, which is the thing this exists to avoid. */
  .quiz { margin-top: 14px; border-top: 2px dashed var(--color-border); padding-top: 10px; }
  .quiz > .lbl { font-size: 10px; font-weight: 800; text-transform: uppercase;
                 letter-spacing: .04em; color: #7c3aed; display: block; margin-bottom: 2px; }
  .quiz .qsub { font-size: 11px; color: var(--color-text-muted); margin-bottom: 8px; }
  .qi { border: 1px solid var(--color-border); border-radius: 10px; padding: 9px 11px;
        margin-bottom: 7px; background: var(--color-bg); }
  .qi .kind { display: inline-block; font-size: 9px; font-weight: 800; text-transform: uppercase;
              letter-spacing: .05em; padding: 2px 6px; border-radius: 999px;
              background: #ede9fe; color: #5b21b6; margin-bottom: 5px; }
  .qi .ask { font-size: 13.5px; line-height: 1.5; font-weight: 600; }
  .qi .hint { font-size: 12px; color: var(--color-text-muted); margin-top: 5px; font-style: italic; }
  .qi .ans { display: none; white-space: pre-wrap; font-size: 13px; line-height: 1.6;
             margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #f1f5f9;
             font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .qi.shown .ans { display: block; }
  .qi .qbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .qi .qbtn { font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px;
              border: 1px solid var(--color-border); background: var(--color-surface);
              color: var(--color-text); cursor: pointer; min-height: 32px; }
  .qi .qbtn.reveal { border-color: #7c3aed; color: #6d28d9; }
  .qi .grade { display: none; gap: 6px; flex-wrap: wrap; }
  .qi.shown .grade { display: flex; }
  /* The reveal button STAYS, and becomes "Hide the answer". Removing it left
     no way back to a hidden answer, so a topic could only be re-attempted by
     reloading the page — and re-reading an answer you have already seen is
     exactly what this quiz exists to prevent. */
  .qi.shown .qbtn.reveal { border-color: var(--color-border); color: var(--color-text-secondary); }
  .qi .qbtn.got { border-color: #059669; color: #047857; }
  .qi .qbtn.miss { border-color: #dc2626; color: #b91c1c; }
  .qi.graded-got { border-color: #6ee7b7; background: #ecfdf5; }
  .qi.graded-miss { border-color: #fca5a5; background: #fef2f2; }
  .qi .verdict { font-size: 11.5px; font-weight: 700; margin-top: 6px; }
  .due-chip { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
              background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  html.dark .qi .ans { background: #0b1220; }
  html.dark .qi .kind { background: #4c1d95; color: #ddd6fe; }
  html.dark .qi.graded-got { background: #052e26; }
  html.dark .qi.graded-miss { background: #3f1212; }
  html.dark .due-chip { background: #422006; color: #fde68a; border-color: #92400e; }
  @media (prefers-color-scheme: dark) {
    :root:not(.light) .qi .ans { background: #0b1220; }
    :root:not(.light) .qi .kind { background: #4c1d95; color: #ddd6fe; }
    :root:not(.light) .qi.graded-got { background: #052e26; }
    :root:not(.light) .qi.graded-miss { background: #3f1212; }
    :root:not(.light) .due-chip { background: #422006; color: #fde68a; border-color: #92400e; }
  }
</style>

<body>
<div class="nav-icons">{% include "_top_nav.html" %}</div>
<div class="wrap">
  <h1>🚀 AI SDE Prep <span class="prog" id="prog"></span></h1>
  <p class="sub">Interactive study bank for AI/ML SDE interviews (Amazon/Google) — DSA, ML concepts, coding, system design &amp; behavioral, each explained in depth. &nbsp;<a href="/interview-prep/guides/ai-sde">📖 Read the full 16-week plan →</a></p>
  <div id="gamebar"></div>
  <div class="effort" id="effort"></div>

  <div class="card" style="margin-bottom:10px;">
    <div class="controls">
      <select id="cat"><option value="">All topics</option></select>
      <select id="pri" title="Study priority band">
        <option value="">Any priority</option>
        <option value="P0">P0 — do first</option>
        <option value="P1">P1 — core</option>
        <option value="P2">P2 — depth</option>
        <option value="P3">P3 — long tail</option>
      </select>
      <select id="sort" title="Order the list">
        <option value="rank">Recommended order</option>
        <option value="quick">Quickest first</option>
        <option value="long">Longest first</option>
        <option value="cat">Category order</option>
      </select>
      <select id="diff"><option value="">Any difficulty</option><option value="Easy">Easy</option><option value="Medium">Medium</option><option value="Hard">Hard</option></select>
      <input type="text" class="search" id="search" placeholder="Search e.g. sliding window, attention, recall, STAR…">
      <label class="only"><input type="checkbox" id="unstudied"> Unstudied only</label>
      <label class="only" id="duewrap" style="display:none"><input type="checkbox" id="duefilter"> <span id="duelabel">Due for review</span></label>
      <a class="btn sm" href="/ai-sde/quiz" title="Daily 25-question quiz">🎯 Daily Quiz</a>
      <button class="btn sm" id="pdf" type="button" title="Open a printable PDF for the current filter">⤓ Export PDF</button>
    </div>
    <!-- Interview tags. Separate row because these answer a different
         question from the row above: not "what shall I study next" but
         "what could actually come up in the round I have on Thursday". -->
    <div class="controls tagrow">
      <span class="tagrow-lbl">Interview tags</span>
      <select id="tpriority" title="How often this is really asked of a new grad">
        <option value="">Any frequency</option>
      </select>
      <select id="ttopic" title="Subject area"><option value="">Any subject</option></select>
      <select id="tsub" title="Sub-area — narrows to one revision session"><option value="">Any sub-area</option></select>
      <select id="tformat" title="What the question makes you do"><option value="">Any format</option></select>
      <select id="tstage" title="Screen or onsite"><option value="">Any round</option></select>
      <select id="ttime" title="How long it takes to answer"><option value="">Any length</option></select>
      <button class="btn sm" id="tclear" type="button" title="Clear the tag filters">✕ Clear tags</button>
    </div>
  </div>
  <div id="list"></div>
</div>

<script src="/static/js/gamify.js"></script>
<script src="/static/js/pomodoro.js"></script>
<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const api = async (p) => { const r = await fetch(p,{credentials:"same-origin"}); if(!r.ok) throw new Error("load failed"); return r.json(); };
  let BANK = null, shown = []; const catLabel = {};

  // [select id, entry field, PDF query param] for the six filterable tags.
  const TAG_FILTERS = [
    ["tpriority", "tag_priority", "tpriority"],
    ["ttopic",    "tag_topic",    "ttopic"],
    ["tsub",      "tag_subtopic", "tsub"],
    ["tformat",   "tag_format",   "tformat"],
    ["tstage",    "tag_stage",    "tstage"],
    ["ttime",     "tag_time",     "ttime"],
  ];
  const FREQ_CLASS = {"Must-Know":"freq-must", "Common":"freq-common", "Rare":"freq-rare"};

  /* The vocabulary the filter dropdowns are built from.

     The server sends it as `tag_vocab`, but the page must not DEPEND on that:
     a payload cached from before the field existed, or an older backend,
     used to leave every dropdown empty — which looks exactly like "tag
     filtering is broken", because with no options there is nothing to pick.
     Every entry already carries its own tag values, so the vocabulary is
     recoverable from the data itself. Server first, entries as the fallback. */
  function tagVocab(){
    if (BANK && BANK.tag_vocab) return BANK.tag_vocab;
    if (!BANK || !BANK.entries) return null;
    const uniq = (field) => [...new Set(BANK.entries.map(e => e[field]).filter(Boolean))].sort();
    const subtopics = {};
    BANK.entries.forEach(e => {
      if (!e.tag_topic || !e.tag_subtopic) return;
      (subtopics[e.tag_topic] = subtopics[e.tag_topic] || new Set()).add(e.tag_subtopic);
    });
    Object.keys(subtopics).forEach(k => { subtopics[k] = [...subtopics[k]].sort(); });
    const derived = {
      topic: uniq("tag_topic"), level: uniq("tag_level"),
      priority: uniq("tag_priority"), format: uniq("tag_format"),
      stage: uniq("tag_stage"), time: uniq("tag_time"), subtopics: subtopics,
    };
    /* Nothing tagged at all — hide the row rather than show six empty
       dropdowns that do nothing when you touch them. */
    return derived.topic.length ? derived : null;
  }

  function fillTagFilters(){
    const v = tagVocab();
    const row = document.querySelector(".controls.tagrow");
    if (!v) { if (row) row.style.display = "none"; return; }
    if (row) row.style.display = "";
    const opts = (sel, values) => {
      const keep = sel.value;
      sel.length = 1;                     // keep the "Any ..." placeholder
      values.forEach(x => sel.add(new Option(x, x)));
      if (values.includes(keep)) sel.value = keep;
    };
    // Alphabetical would read "Common, Must-Know, Rare"; the useful order is
    // by how often it is asked, so pin it when the list is the expected one.
    const PRI = ["Must-Know", "Common", "Rare"];
    opts($("tpriority"), PRI.every(x => v.priority.includes(x)) ? PRI : v.priority);
    opts($("ttopic"),    v.topic);
    opts($("tformat"),   v.format);
    opts($("tstage"),    v.stage);
    opts($("ttime"),     v.time);
    syncSubtopics();
  }

  // Subtopics are scoped to their topic, so the sub-area list follows the
  // subject choice. With no subject picked, offer every subtopic in use so the
  // filter is still usable on its own.
  function syncSubtopics(){
    const v = tagVocab();
    if (!v) return;
    const topic = $("ttopic").value;
    const subs = topic ? (v.subtopics[topic] || [])
                       : [...new Set(Object.values(v.subtopics).flat())].sort();
    const sel = $("tsub"), keep = sel.value;
    sel.length = 1;
    subs.forEach(x => sel.add(new Option(x, x)));
    sel.value = subs.includes(keep) ? keep : "";
  }

  /* ── Card bodies arrive one at a time ─────────────────────────────────
     A written-up topic runs to ~16k characters across answer, walkthrough,
     plain_algo, code and worked examples. Over 1,120 topics that was a 3 MB
     JSON body on every page load, to render content that is COLLAPSED until
     you click it — and the list rebuilt every one of those bodies as an HTML
     string on every keystroke in the search box.

     So the list ships headers only and a body is fetched the first time its
     card is opened, then kept for the rest of the session. */
  const BODIES = new Map();

  /* ── Everything in the body is collapsible ────────────────────────────
     A topic written to the ten-section standard is around 16,000 characters.
     Flat, that is a wall you scroll past instead of reading, and on a phone it
     is minutes of thumb-work to reach the code. So each section is a <details>
     and the labels act as a table of contents: the answer is open, the rest is
     one tap. Native <details> rather than a JS accordion, so keyboard, screen
     readers and browser find-in-page all keep working.
     `hint` is the collapsed preview - what the section holds, without opening
     it, so the list is scannable rather than a row of anonymous labels. */
  function sec(cls, label, inner, opts){
    if (!inner) return "";
    const o = opts || {};
    return `<details class="sec sec-${cls}"${o.open ? " open" : ""}>`
         + `<summary><span class="caret">▸</span><span>${label}</span>`
         + (o.hint ? `<span class="hint2">${esc(o.hint)}</span>` : "")
         + `</summary><div class="secbody">${inner}</div></details>`;
  }

  // A worked example's first line is its section title ("3. THE IDEA TRACED BY
  // HAND"), which makes an ideal summary. Older entries have no such line, so
  // fall back to a trimmed opening and keep the full text in the body.
  function exSummary(text){
    const nl = text.indexOf("\n");
    const head = nl === -1 ? text : text.slice(0, nl);
    if (nl !== -1 && head.trim().length <= 95)
      return {title: head.trim(), body: text.slice(nl + 1).replace(/^\n+/, "")};
    const flat = text.replace(/\s+/g, " ").trim();
    return {title: flat.length > 80 ? flat.slice(0, 78) + "…" : flat, body: text};
  }

  // The answer is written headline-first: one line that states the answer,
  // then short labelled points. Lift that first line out so it can be set as a
  // heading — and fall back to plain text for entries not yet rewritten.
  function answerHTML(val){
    const nl = val.indexOf("\n");
    if (nl === -1) return `<div class="fld answer">${esc(val)}</div>`;
    const head = val.slice(0, nl).trim();
    const rest = val.slice(nl + 1).replace(/^\n+/, "");
    return `<div class="fld answer"><span class="head">${esc(head)}</span>${esc(rest)}</div>`;
  }

  function bodyHTML(e, b){
    const fld = (cls,label,val) => val
      ? sec(cls, label,
            cls === "answer" ? answerHTML(val) : `<div class="fld ${cls}">${esc(val)}</div>`,
            {open: cls === "answer"})
      : "";
    return `
      <div class="secbar"><button type="button" class="btn sm" data-expand>Expand all</button></div>
      ${fld("plan","Prep time & priority",
            `${e.prep_label||""} to learn properly · stack rank #${e.rank} of ${BANK.total}`
            + (e.priority_label ? ` · ${e.priority_label} in its band` : "")
            + (e.priority_minutes_total ? ` (${Math.round((e.priority_minutes_cumulative||0)/60)}h of ${Math.round(e.priority_minutes_total/60)}h into ${e.priority})` : "")
            + (e.cat_rank ? ` · #${e.cat_rank} within ${catLabel[e.cat]||e.cat}` : "")
            + (e.priority_note ? ` · ${e.priority_note}` : ""))}
      ${e.tag_priority ? sec("tags","Interview tags",
          `<div class="fld tags">${esc(
            [e.tag_priority + " for a new grad",
             e.tag_topic + (e.tag_subtopic ? " / " + e.tag_subtopic : ""),
             e.tag_level, e.tag_format + " question",
             e.tag_stage + " round", e.tag_time + " to answer"].join("  ·  ")
          )}${e.tag_flag ? `<span class="flagnote">Note: ${esc(e.tag_flag)}</span>` : ""}</div>`) : ""}
      ${fld("freq","Asked in interviews?",b.frequency)}
      ${fld("answer","Answer / reasoning",b.answer)}
      ${fld("deep","Explained step by step",b.walkthrough)}
      ${fld("recipe","How to code it — plain English, step by step",b.plain_algo)}
      ${b.code ? sec("code","Code",`<div class="code">${esc(b.code)}</div>`) : ""}
      ${b.diagram ? sec("diagram","Diagram",`<div class="code diagram">${esc(b.diagram)}</div>`) : ""}
      ${(b.examples && b.examples.length)
          ? sec("exs", `Worked examples (${b.examples.length})`,
              `<div class="ex-slot">${
                 b.examples.map((x,i) => {
                   const s = exSummary(x);
                   return `<details class="ex"><summary><span class="n">${i+1}</span>`
                        + `<span class="exttl">${esc(s.title)}</span><span class="caret">▸</span></summary>`
                        + `<div class="body">${esc(s.body)}</div></details>`;
                 }).join("")
               }</div>`,
              {hint: "tap a section"})
          : fld("","Example",b.example)}
      ${fld("mnem","How to remember",b.mnemonic)}
      ${fld("cx","Complexity",b.complexity)}
      ${fld("pitfall","Common pitfalls",b.pitfalls)}
      ${fld("follow","Follow-up questions",b.followups)}
      ${b.tags&&b.tags.length ? `<div class="tags">${b.tags.map(t=>`<button class="tag" data-tag="${esc(t)}" type="button">#${esc(t)}</button>`).join("")}</div>` : ""}
      <div class="q-actions">
        <a class="btn sm" href="/ai-sde/pdf?id=${e.id}" target="_blank" rel="noopener">⤓ PDF</a>
        <button class="btn sm" type="button" data-sched-open>📅 Schedule this</button>
        <div class="sched" hidden>
          <label>Day <input type="date" class="sched-date" value="${todayISO()}"></label>
          <label>Time <input type="time" class="sched-time"></label>
          <button class="btn sm primary" type="button" data-sched-go>Put it on the calendar</button>
          <span class="sched-msg">Leave the time blank and it sits at 12:00 AM, the top of that day. It lands in the AISDEPrep project, the calendar, and the Quick Bucket.</span>
        </div>
      </div>
      ${quizHTML(e, b.quiz)}`;
  }


  /* ── Recall quiz + spaced review ──────────────────────────────────────
     Re-reading a topic builds recognition; an interview demands recall. The
     quiz below every card is the difference: an open prompt, nothing to pick
     from, and the answer hidden until she has committed to an attempt. That
     last part is not a detail — an answer visible on screen turns the whole
     thing back into reading.

     Grading herself is what makes it a schedule rather than a worksheet. A
     hit pushes the topic further out (1, 3, 7, 16, 35 days); a miss brings it
     back tomorrow. Tomorrow, not later today: seeing it again in the same
     sitting is re-reading with extra steps.

     Stored by TITLE for the same reason progress is — the "ai{i}" id is the
     entry's index in the bank and shifts whenever the bank changes. Local for
     now; the columns are in MIGRATION_AI_SDE_PROGRESS.sql for when it runs. */
  const RKEY = "ai_sde_recall_v1";
  const INTERVALS = [1, 3, 7, 16, 35];
  const DAY_MS = 86400000;

  let recall = {};
  try { recall = JSON.parse(localStorage.getItem(RKEY) || "{}") || {}; } catch(_) { recall = {}; }
  const saveRecall = () => { try { localStorage.setItem(RKEY, JSON.stringify(recall)); } catch(_){} };

  const dayStart = (t) => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };

  function isDue(title){
    const r = recall[title];
    if (!r || !r.due) return false;
    return dayStart(r.due) <= dayStart(Date.now());
  }

  function dueCount(){
    return BANK ? BANK.entries.filter(e => isDue(e.title)).length : 0;
  }

  function gradeItem(title, correct){
    const r = recall[title] || {streak: 0, hits: 0, misses: 0};
    r.streak = correct ? (r.streak || 0) + 1 : 0;
    if (correct) r.hits = (r.hits || 0) + 1; else r.misses = (r.misses || 0) + 1;
    // A miss resets to tomorrow; a hit steps up the ladder.
    const step = correct ? Math.min(r.streak - 1, INTERVALS.length - 1) : 0;
    r.due = Date.now() + INTERVALS[step] * DAY_MS;
    r.last = Date.now();
    recall[title] = r;
    saveRecall();
    return {days: INTERVALS[step], streak: r.streak};
  }

  const KIND_LABEL = {
    recall: "Core idea", blank_editor: "Blank editor", trap: "The trap",
    complexity: "Complexity", transfer: "Transfer", recipe: "Plain English",
    followup: "Follow-up",
  };

  function quizHTML(e, quiz){
    if (!quiz || !quiz.length) return "";
    const r = recall[e.title] || {};
    const streak = r.streak || 0;
    const note = streak
      ? `${streak} in a row · next review ${r.due ? new Date(r.due).toLocaleDateString() : "—"}`
      : "Attempt each one out loud BEFORE you reveal. Guessing then checking beats reading.";
    return `
      <div class="quiz" data-quiz="${esc(e.title)}">
        <span class="lbl">Recall check — ${quiz.length} question${quiz.length===1?"":"s"}</span>
        <div class="qsub">${esc(note)}</div>
        ${quiz.map((q, i) => `
          <div class="qi" data-qi="${i}">
            <span class="kind">${esc(KIND_LABEL[q.kind] || q.kind)}</span>
            <div class="ask">${esc(q.q)}</div>
            ${q.hint ? `<div class="hint">Nudge: ${esc(q.hint)}</div>` : ""}
            <div class="ans">${esc(q.a)}</div>
            <div class="qbtns">
              <button type="button" class="qbtn reveal" data-reveal aria-expanded="false">Show the answer</button>
              <span class="grade">
                <button type="button" class="qbtn got"  data-grade="1">I had it</button>
                <button type="button" class="qbtn miss" data-grade="0">I missed it</button>
              </span>
            </div>
            <div class="verdict"></div>
          </div>`).join("")}
      </div>`;
  }

  async function loadBody(card){
    const slot = card.querySelector(".q-body");
    if (!slot || slot.dataset.loaded) return;
    const id = card.dataset.id;
    const e = BANK.entries.find(x => x.id === id);
    if (!e) return;
    // Filling the body replaces its innerHTML, which throws away the Pomodoro
    // bar that was inserted while the card was still empty — put it back.
    const paint = (b) => {
      slot.innerHTML = bodyHTML(e, b);
      slot.dataset.loaded = "1";
      if (window.Pomodoro && Pomodoro.refresh) Pomodoro.refresh("ai_sde");
    };
    if (BODIES.has(id)) { paint(BODIES.get(id)); return; }
    slot.innerHTML = '<div class="fld"><span class="lbl">Loading…</span></div>';
    try {
      const b = await api(`/api/ai-sde/entry/${encodeURIComponent(id)}`);
      BODIES.set(id, b);
      paint(b);
    } catch(_) {
      slot.innerHTML = '<div class="fld"><span class="lbl">Could not load this topic — reload the page.</span></div>';
    }
  }

  /* ── Studied state ────────────────────────────────────────────────────
     Held in memory as entry IDs (that is what the DOM uses), but PERSISTED
     BY TITLE, because the id is the entry's index in the bank and shifts
     every time a topic is added or deduped — so ids stored yesterday point
     at different topics today. Titles are stable.

     The server is the source of truth so progress follows the user between
     phone and laptop; localStorage stays on as an offline mirror, which is
     also what makes the first paint instant instead of waiting on a fetch. */
  const PKEY = "ai_sde_studied_titles"; const studied = new Set();
  const LEGACY_PKEY = "ai_sde_studied";
  let progressSynced = false;

  const titleOf = (id) => (BANK && (BANK.entries.find(x => x.id === id) || {}).title) || null;
  const idOfTitle = (t) => (BANK && (BANK.entries.find(x => x.title === t) || {}).id) || null;

  const saveLocal = () => {
    try {
      const titles = [...studied].map(titleOf).filter(Boolean);
      localStorage.setItem(PKEY, JSON.stringify(titles));
    } catch(_) {}
  };

  /* Persist one topic. Fire-and-forget: a tick must feel instant, and the
     local mirror already holds it if the request fails. */
  async function pushProgress(id, isStudied){
    const title = titleOf(id);
    if (!title) return;
    try {
      await fetch("/api/ai-sde/progress", {
        method: "POST", credentials: "same-origin",
        headers: {"Content-Type": "application/json",
                  "X-CSRFToken": (document.querySelector('meta[name=csrf-token]')||{}).content || ""},
        body: JSON.stringify({title: title, studied: !!isStudied}),
      });
    } catch(_) { /* offline — the mirror keeps it until the next load */ }
  }

  /* ── Schedule a topic onto a day ────────────────────────────────────
     Reading a topic and *planning* to read it are different acts, and
     only the second one survives a busy week. This puts the topic where
     the day is already being run from: the AISDEPrep project, the
     calendar grid, and the Quick Bucket, in one request.

     A blank time means midnight, and midnight is a position rather than
     a missing value — the calendar grid starts at hour 0, so 00:00 draws
     at the very top of the day, the way an all-day row does elsewhere.

     LOCAL date, not toISOString(). toISOString() converts to UTC first,
     so anywhere west of Greenwich it hands back yesterday for most of
     the evening — the picker would open on the wrong day. */
  function todayISO(){
    const d = new Date();
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  }

  async function scheduleTopic(card, box){
    const id    = card.dataset.id;
    const msg   = box.querySelector(".sched-msg");
    const go    = box.querySelector("[data-sched-go]");
    const day   = box.querySelector(".sched-date").value;
    const time  = box.querySelector(".sched-time").value;
    if (!day) { msg.className = "sched-msg err"; msg.textContent = "Pick a day first."; return; }

    go.disabled = true;
    msg.className = "sched-msg";
    msg.textContent = "Adding…";
    try {
      const r = await fetch("/api/ai-sde/schedule", {
        method: "POST", credentials: "same-origin",
        headers: {"Content-Type": "application/json",
                  "X-CSRFToken": (document.querySelector('meta[name=csrf-token]')||{}).content || ""},
        // The title rides along with the id: "ai42" is the entry's INDEX
        // in the bank, so a tab left open across a bank update would
        // otherwise schedule whatever moved into slot 42. The server
        // trusts the title and treats the id as a hint.
        body: JSON.stringify({id: id, title: titleOf(id), plan_date: day, start_time: time}),
      });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(out.error || ("HTTP " + r.status));
      msg.className = "sched-msg ok";
      msg.textContent = (out.status === "already-scheduled" ? "Already there — " : "Added — ") + (out.message || day);
      if (window.showToast) showToast(out.message || "Scheduled", "success");
    } catch (err) {
      msg.className = "sched-msg err";
      msg.textContent = "Could not schedule it: " + err.message;
    } finally {
      go.disabled = false;
    }
  }

  const saveP = () => { saveLocal(); };
  const prog = () => { if(BANK) $("prog").textContent = `${studied.size} / ${BANK.total} studied`; };
  // Minutes -> "3h 20m", the unit a study plan is actually made of.
  const hrs = (m) => m < 60 ? `${m}m` : (m%60 ? `${Math.floor(m/60)}h ${m%60}m` : `${Math.floor(m/60)}h`);

  // How much work the current filter represents, and how much of it is left.
  // This is the whole point of prep_minutes: "am I 4 hours from ready, or 40?"
  function effort(list){
    const tot  = list.reduce((s,e)=>s+(e.prep_minutes||0),0);
    const left = list.reduce((s,e)=>s+(studied.has(e.id)?0:(e.prep_minutes||0)),0);
    const pct  = tot ? Math.round((tot-left)/tot*100) : 0;
    // Actual effort clocked by the per-question Pomodoro timers, against
    // the estimate for the same topics: "am I faster or slower than planned?"
    let actualPart = "";
    if (window.Pomodoro) {
      const ids  = list.map(e=>e.id);
      const secs = Pomodoro.total("ai_sde", ids);
      const done = list.filter(e => Pomodoro.logged("ai_sde", e.id) >= 30);
      const est  = done.reduce((s,e)=>s+(e.prep_minutes||0),0);
      actualPart =
        `<span>⏳ <b>${hrs(Math.round(secs/60))}</b> actually clocked` +
        (est ? ` on ${done.length} topic${done.length===1?"":"s"} (est ${hrs(est)} → <b>${Math.round(secs/60/est*100)}%</b>)` : "") +
        `</span>`;
    }
    $("effort").innerHTML =
      `<span>⏱ <b>${hrs(left)}</b> of prep left</span>` +
      `<span>${list.length} topic${list.length===1?"":"s"} shown · <b>${hrs(tot)}</b> total</span>` +
      `<span><b>${pct}%</b> done</span>` +
      actualPart +
      `<span>≈ <b>${(left/60/2).toFixed(0)}</b> days at 2 h/day</span>` +
      `<span class="bar"><i style="width:${pct}%"></i></span>`;
  }

  /* Seed `studied` from the local mirror first (instant), then reconcile
     with the server. Titles that no longer exist in the bank are dropped
     rather than silently marking whatever now sits at that position. */
  function loadStudied(){
    studied.clear();
    let titles = [];
    try { titles = JSON.parse(localStorage.getItem(PKEY) || "[]") || []; } catch(_) {}
    if (!titles.length) {
      /* One-time rescue of the old id-keyed store. Those ids were index
         based and the bank has been reordered since, so they cannot be
         trusted — we migrate the COUNT of nothing and simply drop them,
         rather than mark the wrong topics as done. */
      try {
        const legacy = JSON.parse(localStorage.getItem(LEGACY_PKEY) || "[]") || [];
        if (legacy.length) console.info(
          `[ai-sde] discarding ${legacy.length} legacy id-keyed ticks — the ids ` +
          `were positional and no longer identify the same topics`);
      } catch(_) {}
    }
    titles.forEach(t => { const id = idOfTitle(t); if (id) studied.add(id); });
    syncStudied();
  }

  /* Pull the server's copy and merge. Union, not replace: a tick made
     offline on this device must not be erased by an older server row. */
  async function syncStudied(){
    try {
      const r = await fetch("/api/ai-sde/progress", {credentials: "same-origin"});
      if (!r.ok) return;                       // 503 = migration not run yet
      const data = await r.json();
      let added = 0;
      (data.studied || []).forEach(t => {
        const id = idOfTitle(t);
        if (id && !studied.has(id)) { studied.add(id); added++; }
      });
      progressSynced = true;
      if (added) { saveLocal(); prog(); render(); }
    } catch(_) { /* offline: the mirror stands in */ }
  }

  /* Search runs on the SERVER now (/api/ai-sde/search), because the browser
     no longer holds the prose to search — the bodies are not shipped. The
     endpoint returns matching ids and everything else stays client-side and
     instant, so only the text box costs a round trip. It is debounced: an
     un-debounced keystroke handler fired a request per character.

     `searchIds` is null when the box is empty, which means "no constraint" —
     distinct from an empty Set, which means "matched nothing". */
  let searchIds = null;
  let searchSeq = 0;

  async function runSearch(){
    const term = ($("search").value||"").trim();
    if (!term) { searchIds = null; render(); return; }
    const seq = ++searchSeq;
    try {
      const r = await api(`/api/ai-sde/search?q=${encodeURIComponent(term)}`);
      // A slow reply for an earlier keystroke must not overwrite a newer one.
      if (seq !== searchSeq) return;
      searchIds = new Set(r.ids || []);
    } catch(_) {
      if (seq !== searchSeq) return;
      searchIds = null;                       // degrade to unfiltered, not empty
    }
    render();
  }

  let searchTimer = null;
  function onSearchInput(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 180);
  }

  /* The review queue only means something if she can find it. The chip shows
     the count and the checkbox narrows to exactly those topics; both hide
     entirely until something is actually due, so a first-time page has no
     dead controls on it. */
  function refreshDue(){
    const n = dueCount();
    const wrap = $("duewrap");
    if (!wrap) return;
    wrap.style.display = n ? "" : "none";
    $("duelabel").innerHTML = `Due for review <span class="due-chip">${n}</span>`;
    if (!n && $("duefilter").checked) { $("duefilter").checked = false; render(); }
  }

  function render(){
    if(!BANK) return;
    const cat = $("cat").value, onlyUn = $("unstudied").checked;
    const onlyDue = $("duefilter") ? $("duefilter").checked : false;
    const diff = $("diff") ? $("diff").value : "";
    const pri = $("pri") ? $("pri").value : "", sort = $("sort") ? $("sort").value : "rank";
    // The six interview-tag filters, applied on top of everything above.
    const tv = {}; TAG_FILTERS.forEach(([id, field]) => { tv[field] = $(id) ? $(id).value : ""; });
    const list = BANK.entries.filter(e =>
      (!cat || e.cat===cat) && (!onlyUn || !studied.has(e.id)) && (!diff || e.difficulty===diff) &&
      (!onlyDue || isDue(e.title)) &&
      (!pri || e.priority===pri) &&
      TAG_FILTERS.every(([, field]) => !tv[field] || e[field] === tv[field]) &&
      (searchIds === null || searchIds.has(e.id))
    );
    // "Recommended" is the bank's own stack rank: highest-yield topic first.
    if (sort === "rank")       list.sort((a,b)=>(a.rank||0)-(b.rank||0));
    else if (sort === "quick") list.sort((a,b)=>(a.prep_minutes||0)-(b.prep_minutes||0) || (a.rank||0)-(b.rank||0));
    else if (sort === "long")  list.sort((a,b)=>(b.prep_minutes||0)-(a.prep_minutes||0) || (a.rank||0)-(b.rank||0));
    prog(); shown = list; effort(list);
    // HEADERS ONLY. The body is filled by loadBody() when the card is opened,
    // which is what keeps this loop cheap enough to run on every filter change.
    $("list").innerHTML = list.map(e => `
      <div class="q-card ${studied.has(e.id)?'done':''}" data-id="${e.id}" data-est="${e.prep_minutes||''}">
        <div class="q-head" data-toggle>
          <input type="checkbox" class="q-prac" ${studied.has(e.id)?'checked':''} title="Mark studied">
          <span class="q-text">${esc(e.title)}</span>
          <span class="q-chips">
            ${e.priority ? `<span class="q-pri pri-${esc(e.priority)}" title="${esc(e.priority_note||'')}">${esc(e.priority)}</span>` : ""}
            ${e.prep_label ? `<span class="q-time" title="Time to work this topic properly, once">⏱ ${esc(e.prep_label)}</span>` : ""}
            ${e.tag_priority ? `<span class="q-freq ${FREQ_CLASS[e.tag_priority]||''}" title="How often this is really asked of a new grad">${esc(e.tag_priority)}</span>` : ""}
            ${e.tag_subtopic ? `<span class="q-sub" title="${esc(e.tag_topic||'')} — sub-area">${esc(e.tag_subtopic)}</span>` : ""}
            ${e.difficulty ? `<span class="q-diff diff-${esc((e.difficulty||'').toLowerCase())}">${esc(e.difficulty)}</span>` : ""}
            <span class="q-badge">${esc(catLabel[e.cat]||e.cat)}</span>
          </span>
        </div>
        <div class="q-body"></div>
      </div>`).join("") || '<div class="card"><div class="empty">No topics match.</div></div>';
  }

  $("list").addEventListener("click", (e) => {
    const card = e.target.closest(".q-card"); if(!card) return;
    const id = card.dataset.id;
    if (e.target.classList.contains("q-prac")) {
      if (e.target.checked) studied.add(id); else studied.delete(id);
      // Ticking a topic earns notes worth its prep time (once per topic).
      if (e.target.checked && window.Gamify) {
        const ent = BANK.entries.find(x => x.id === id) || {};
        Gamify.studied(id, ent.prep_minutes, {difficulty: ent.difficulty, priority: ent.priority});
      }
      // Re-read the effort line so "prep left" drops the moment you tick a box.
      saveP(); pushProgress(id, e.target.checked);
      card.classList.toggle("done", e.target.checked); prog(); effort(shown); return;
    }
    // ── Quiz: reveal, then self-grade ────────────────────────────────
    // Handled before anything else in the card so a button press never
    // bubbles into the open/close toggle.
    // Show/Hide, not show-once: an answer you cannot put away again means the
    // only way to re-attempt a question is to reload the page.
    const reveal = e.target.closest("[data-reveal]");
    if (reveal) {
      const shown = reveal.closest(".qi").classList.toggle("shown");
      reveal.textContent = shown ? "Hide the answer" : "Show the answer";
      reveal.setAttribute("aria-expanded", shown ? "true" : "false");
      return;
    }
    // Expand all / collapse all for the sections of one card.
    const expand = e.target.closest("[data-expand]");
    if (expand) {
      const secs = [...card.querySelectorAll(".q-body details")];
      const opening = secs.some(d => !d.open);
      secs.forEach(d => { d.open = opening; });
      expand.textContent = opening ? "Collapse all" : "Expand all";
      return;
    }
    // ── Schedule this topic onto a day ───────────────────────────────
    // Both branches return before the fall-through at the bottom, which
    // would otherwise read a press on the Add button as a card toggle
    // and fold the card shut mid-edit.
    const schedOpen = e.target.closest("[data-sched-open]");
    if (schedOpen) {
      const box = card.querySelector(".sched");
      const opening = box.hasAttribute("hidden");
      if (opening) box.removeAttribute("hidden"); else box.setAttribute("hidden", "");
      schedOpen.textContent = opening ? "✕ Cancel" : "📅 Schedule this";
      if (opening) box.querySelector(".sched-date").focus();
      return;
    }
    const schedGo = e.target.closest("[data-sched-go]");
    if (schedGo) { scheduleTopic(card, schedGo.closest(".sched")); return; }
    if (e.target.closest(".sched")) return;   // typing in the date/time fields
    const grade = e.target.closest("[data-grade]");
    if (grade) {
      const qi = grade.closest(".qi");
      const title = qi.closest("[data-quiz]").dataset.quiz;
      const correct = grade.dataset.grade === "1";
      const out = gradeItem(title, correct);
      qi.classList.remove("graded-got", "graded-miss");
      qi.classList.add(correct ? "graded-got" : "graded-miss");
      qi.querySelector(".verdict").textContent = correct
        ? `Back in ${out.days} day${out.days === 1 ? "" : "s"} · ${out.streak} in a row`
        : "Back tomorrow. Seeing it again today would be re-reading, not recall.";
      qi.querySelectorAll("[data-grade]").forEach(b => { b.disabled = true; });
      refreshDue();
      return;
    }
    const tag = e.target.closest("[data-tag]");
    if (tag) { $("search").value = tag.dataset.tag; $("cat").value=""; runSearch(); window.scrollTo({top:0,behavior:"smooth"}); return; }
    if (e.target.closest("a")) return;               // let PDF link navigate
    if (e.target.closest(".q-head")) {
      card.classList.toggle("open");
      if (card.classList.contains("open")) loadBody(card);
    }
  });

  $("cat").addEventListener("change", render);
  if ($("pri")) $("pri").addEventListener("change", render);
  if ($("sort")) $("sort").addEventListener("change", render);
  if ($("diff")) $("diff").addEventListener("change", render);
  $("search").addEventListener("input", onSearchInput);
  $("unstudied").addEventListener("change", render);
  if ($("duefilter")) $("duefilter").addEventListener("change", render);
  TAG_FILTERS.forEach(([id]) => {
    const sel = $(id); if (!sel) return;
    // Changing the subject re-scopes the sub-area list before re-rendering.
    sel.addEventListener("change", () => { if (id === "ttopic") syncSubtopics(); render(); });
  });
  if ($("tclear")) $("tclear").addEventListener("click", () => {
    TAG_FILTERS.forEach(([id]) => { if ($(id)) $(id).value = ""; });
    syncSubtopics(); render();
  });
  $("pdf").addEventListener("click", () => {
    const p = new URLSearchParams();
    if ($("cat").value) p.set("cat", $("cat").value);
    if ($("pri") && $("pri").value) p.set("pri", $("pri").value);
    // Export exactly the revision sheet on screen, tag filters included.
    TAG_FILTERS.forEach(([id, , param]) => { if ($(id) && $(id).value) p.set(param, $(id).value); });
    const term = ($("search").value||"").trim(); if (term) p.set("q", term);
    window.open("/ai-sde/pdf" + (p.toString()?"?"+p.toString():""), "_blank", "noopener");
  });

  (async () => {
    try {
      BANK = await api("/api/ai-sde");
      loadStudied();
      (BANK.categories||[]).forEach(c => catLabel[c.key]=c.label);
      $("cat").innerHTML = '<option value="">All topics</option>' + (BANK.categories||[]).map(c=>`<option value="${c.key}">${esc(c.label)}</option>`).join("");
      fillTagFilters();
      refreshDue();
      render();
      // Per-question Pomodoro timers + actual-effort log.
      if (window.Pomodoro) {
        Pomodoro.init({ ns: "ai_sde", container: $("list") });
        document.addEventListener("pomodoro:change", () => {
          effort(shown);
          // Focus minutes are notes too - syncMinutes only counts the increase.
          if (window.Gamify) Gamify.syncMinutes("ai_sde", Pomodoro.total("ai_sde")/60);
        });
      }
      // Sadhana: the singing-themed progression bar.
      if (window.Gamify) {
        Gamify.mount($("gamebar"));
        // Credit topics ticked before the game existed, and time already
        // clocked - silently, so there is no cascade of level-up chimes.
        Gamify.studiedBulk(BANK.entries.filter(x => studied.has(x.id)).map(x => ({
          id: x.id, minutes: x.prep_minutes, difficulty: x.difficulty, priority: x.priority
        })));
        if (window.Pomodoro) Gamify.syncMinutes("ai_sde", Pomodoro.total("ai_sde")/60);
      }
    } catch(e){ if(window.toast) toast("Couldn't load","error"); }
    if (window.feather) feather.replace();
  })();
})();
</script>
</body>
</html>
